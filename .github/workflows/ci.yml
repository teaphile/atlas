name: Verify ATLAS
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: atlas-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies (Unix)
        if: runner.os != 'Windows'
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Install locked Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install --require-hashes -r backend/requirements-dev-windows.txt
      - run: python -m pip check
      - run: python -m ruff check backend --select F,E9
      - run: python -m pytest -q
      - run: npm ci --prefix frontend --no-fund
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Production npm advisory audit
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high --prefix frontend
      - name: Production Python advisory audit
        if: runner.os == 'Linux'
        run: python -m pip install pip-audit==2.10.1 && python -m pip_audit -r backend/requirements.txt
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag atlas:ci .
