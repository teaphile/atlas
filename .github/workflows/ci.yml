name: Verify ATLAS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: npm ci --prefix frontend --no-fund
      - run: ./scripts/check.sh
      - run: npm audit --omit=dev --audit-level=high --prefix frontend
      - run: pip install pip-audit==2.10.1 && pip-audit -r backend/requirements.txt
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag atlas:ci .
