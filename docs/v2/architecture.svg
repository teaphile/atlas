<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc"><title id="title">ATLAS 2.0 architecture</title><desc id="desc">Public data passes through a bounded server-side gateway, normalization and caches to transparent numerical methods and same-origin APIs. The browser provides mapping, analysis, comparison, records and portable preferences without receiving provider credentials.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7bbda9" stroke-width="1.4"/></marker><style>text{font-family:system-ui,sans-serif;fill:#dcebe6}.title{font-size:30px;font-weight:600}.sub{font-size:14px;fill:#a2b9b6}.eyebrow{font-size:12px;letter-spacing:2px;fill:#9ce8c9}.head{font-size:18px;font-weight:600}.body{font-size:14px;fill:#b7ceca}.box{fill:#172a34;stroke:#3b5860;stroke-width:1.2}.line{fill:none;stroke:#7bbda9;stroke-width:1.5;marker-end:url(#arrow)}</style></defs><rect width="1400" height="840" rx="18" fill="#0c1922"/><text x="38" y="44" class="eyebrow">ATLAS 2.0 / SYSTEM MAP</text><text x="38" y="86" class="title">Shared evidence. Separate scientific contracts.</text><text x="38" y="116" class="sub">No arbitrary-URL proxy · No invented missing values · No downloaded ML weights · One process until state is shared</text><g transform="translate(38 150)"><rect width="313" height="104" rx="9" class="box"/><text x="19" y="33" class="head">Public records &amp; bulletins</text><text x="19" y="60" class="body">USGS · NASA · NOAA · GDACS…</text><text x="19" y="83" class="body">Observed / reported / catalogued</text></g><g transform="translate(375 150)"><rect width="313" height="104" rx="9" class="box"/><text x="19" y="33" class="head">Weather &amp; air models</text><text x="19" y="60" class="body">Open-Meteo · CAMS</text><text x="19" y="83" class="body">Seven past + five forecast days</text></g><g transform="translate(712 150)"><rect width="313" height="104" rx="9" class="box"/><text x="19" y="33" class="head">Soil &amp; regional context</text><text x="19" y="60" class="body">ISRIC · hydrology · climate…</text><text x="19" y="83" class="body">Point scope ≠ field diagnosis</text></g><g transform="translate(1049 150)"><rect width="313" height="104" rx="9" class="box"/><text x="19" y="33" class="head">Scope-limited sources</text><text x="19" y="60" class="body">TfL public catalog · regional air</text><text x="19" y="83" class="body">Optional FIRMS Area: server key</text></g><path d="M194 254V294M531 254V294M869 254V294M1206 254V294" class="line"/><rect x="38" y="298" width="1324" height="95" rx="9" class="box"/><text x="61" y="329" class="eyebrow">01 / BOUNDED DATA PLANE</text><text x="61" y="359" class="head">Fixed upstream origins → quotas / pacing / circuits → typed provider normalization</text><text x="61" y="381" class="body">Per-query single-flight · response budgets · explicit nulls and units · source/fetch/model/event clocks · valid-empty vs failure</text><path d="M254 393V431M700 393V431M1147 393V431" class="line"/><g transform="translate(38 435)"><rect width="426" height="137" rx="9" class="box"/><text x="21" y="31" class="eyebrow">02 / SHARED EVIDENCE</text><text x="21" y="62" class="head">Event / Payload / Envelope</text><text x="21" y="88" class="body">Spatial + temporal filters and bounded grouping</text><text x="21" y="112" class="body">Polygon membership · overlaps disclosed</text></g><g transform="translate(487 435)"><rect width="426" height="137" rx="9" class="box"/><text x="21" y="31" class="eyebrow">03 / STATE AND FRESHNESS</text><text x="21" y="62" class="head">LRU memory + SQLite cache</text><text x="21" y="88" class="body">Entry/byte caps · negative cache · rollback</text><text x="21" y="112" class="body">Last-good age preserved · expiry / readiness</text></g><g transform="translate(936 435)"><rect width="426" height="137" rx="9" class="box"/><text x="21" y="31" class="eyebrow">04 / TRANSPARENT METHODS</text><text x="21" y="62" class="head">UTC grid → derived analysis</text><text x="21" y="88" class="body">Complete windows · psychrometrics · thermal time</text><text x="21" y="112" class="body">Tiny novelty · robust slopes · rank association</text></g><path d="M254 572V610M700 572V610M1147 572V610" class="line"/><rect x="38" y="614" width="1324" height="81" rx="9" class="box"/><text x="61" y="643" class="eyebrow">05 / SAME-ORIGIN FASTAPI</text><text x="61" y="675" class="body">Snapshot / SSE or private polling · location · insights · 2–3-place compare · AOI · bounded map / image endpoints · header-only access</text><path d="M700 695V731" class="line"/><rect x="38" y="735" width="1324" height="70" rx="9" fill="#193a37" stroke="#649e8b"/><text x="61" y="764" class="head">React / TypeScript / MapLibre / accessible SVG tables</text><text x="61" y="789" class="body">Map + Signal Lab + Compare + Records · generation-owned cancellation · responsive controls · portable settings/polygons, never secrets</text></svg>