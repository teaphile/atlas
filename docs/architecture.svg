<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#86dec0"/></marker><style>text{font-family:Arial,sans-serif;fill:#dce9e7}.small{font-size:14px;fill:#91a9b6}.label{font-size:12px;fill:#86dec0;letter-spacing:2px}.title{font-size:21px;font-weight:700}.box{fill:#14232d;stroke:#35505b;stroke-width:1}.line{fill:none;stroke:#86dec0;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1280" height="690" rx="18" fill="#0b151e"/><text x="50" y="52" class="label">ATLAS / SYSTEM ARCHITECTURE</text><text x="50" y="95" font-size="32" font-weight="700">One contract. Visible uncertainty. Bounded execution.</text><text x="50" y="126" class="small">Implemented single-process architecture — not a diagram of imaginary distributed infrastructure.</text>
<rect class="box" x="50" y="180" width="250" height="160" rx="12"/><text x="72" y="216" class="title">Browser workspace</text><text x="72" y="247" class="small">React · TypeScript · MapLibre</text><text x="72" y="275" class="small">Maps / reports / source inspector</text><text x="72" y="302" class="small">No provider keys or mock feeds</text>
<rect class="box" x="350" y="180" width="260" height="160" rx="12"/><text x="372" y="216" class="title">Same-origin API edge</text><text x="372" y="247" class="small">FastAPI + ASGI security controls</text><text x="372" y="275" class="small">Typed input · auth · rate / body caps</text><text x="372" y="302" class="small">Bounded map and image proxies</text>
<rect class="box" x="660" y="180" width="270" height="160" rx="12"/><text x="682" y="216" class="title">Ingestion engine</text><text x="682" y="247" class="small">Per-query single-flight + TTL</text><text x="682" y="275" class="small">Fresh / empty / stale / unavailable</text><text x="682" y="302" class="small">Last-good cache + expiry semantics</text>
<rect class="box" x="980" y="180" width="250" height="160" rx="12"/><text x="1002" y="216" class="title">Provider boundary</text><text x="1002" y="247" class="small">23 schema-aware adapters</text><text x="1002" y="275" class="small">Fixed HTTPS origins · no redirects</text><text x="1002" y="302" class="small">Quotas · deadlines · byte budgets</text>
<path class="line" d="M300 255H340"/><path class="line" d="M610 255H650"/><path class="line" d="M930 255H970"/>
<rect class="box" x="50" y="435" width="330" height="140" rx="12"/><text x="72" y="471" class="title">Explicit analytical layer</text><text x="72" y="503" class="small">ECEF/time buckets + bounded union-find</text><text x="72" y="530" class="small">Date-line AOI · FFWI · soil stock · RUSLE</text><text x="72" y="554" class="small">Screening and scenarios ≠ probabilities</text>
<rect class="box" x="435" y="435" width="330" height="140" rx="12"/><text x="457" y="471" class="title">Bounded SQLite / memory</text><text x="457" y="503" class="small">WAL persistence · byte and entry limits</text><text x="457" y="530" class="small">Original successful fetch time retained</text><text x="457" y="554" class="small">Last-good snapshots, not a historical lake</text>
<rect class="box" x="820" y="435" width="410" height="140" rx="12"/><text x="842" y="471" class="title">Public data + optional credentials</text><text x="842" y="503" class="small">USGS · NASA · NOAA · ISRIC · Open-Meteo</text><text x="842" y="530" class="small">GDACS · TfL · ADSB.lol · GBIF · CISA · others</text><text x="842" y="554" class="small">Provider scope, terms, clocks and outages remain visible</text>
<path class="line" d="M480 340V385H215V425"/><path class="line" d="M790 340V380H600V425"/><path class="line" d="M1105 340V425"/>
<path d="M780 180V155H175V180" fill="none" stroke="#8d9ed0" stroke-width="1.5" stroke-dasharray="5 5"/><text x="480" y="165" font-size="12" fill="#8d9ed0">SSE invalidation + current-state resync</text>
<line x1="50" y1="620" x2="1230" y2="620" stroke="#2a3e49"/><text x="50" y="653" class="small">Scale later with shared collectors / quotas / bus + PostGIS. Validate hazard models independently. Never relabel missing data as safety.</text></svg>